# Drop-in for one pulse's service. Needs systemd 253 or newer (`OpenFile=`).
# Copy to the unit that runs the pulse, for example:
#   install -D -m 0644 pulse-null-receipts.conf \
#     /etc/systemd/system/pulse-null@.service.d/receipts.conf
#   systemctl daemon-reload
#   systemctl restart pulse-null@<pulse>
# %i is the pulse name. Create the directory first, as root:
#   pulse-null receipts install --pulse <pulse> --group <group>
# The anchor config is /etc/pulse-null/anchor.toml. The token file is
# /etc/pulse-null/anchor/token. The operator creates the private repository
# and the token. This file does not contain either.

[Service]
OpenFile=/var/lib/pulse-null/%i/receipts.jsonl:receipts:append
Environment=PULSE_NULL_RECEIPTS=required
